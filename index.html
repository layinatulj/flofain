  <style>
   *{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',sans-serif;background:#f0fdf4;color:#18352c}.flip-card{perspective:1000px;min-height:300px;cursor:pointer}.flip-inner{position:relative;width:100%;height:300px;transition:transform .65s;transform-style:preserve-3d}.flip-card.flipped .flip-inner{transform:rotateY(180deg)}.flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #164e6320;border:1px solid #d1fae5;background:white}.flip-front img{width:100%;height:255px;object-fit:cover;display:block}.flip-front .name{height:45px;display:flex;align-items:center;justify-content:center;font-weight:800;padding:6px;text-align:center;color:#166534}.flip-back{transform:rotateY(180deg);padding:18px;overflow:auto;background:linear-gradient(145deg,#fff,#ecfdf5)}.region-tag{display:inline-block;background:#d1fae5;color:#065f46;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700}.map-area{position:absolute;border:2px dashed transparent;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}.map-area:hover{background:#60a5fa55;border-color:#2563eb}.map-label{background:#fffE;padding:4px 9px;border-radius:20px;font-weight:700;font-size:12px;color:#1d4ed8;opacity:0}.map-area:hover .map-label{opacity:1}.modal-bg{background:#0008}.navbtn{padding:12px 16px;font-weight:800;border-bottom:4px solid transparent}.navbtn.active{border-color:#2563eb;color:#2563eb;background:#eff6ff}.field{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px 13px;background:white}.field:focus{outline:2px solid #6ee7b7}.fade{animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  </style>
 </head>
 <body>

  <script type="text/babel">
   const {useState}=React;
// Ganti dengan URL Web App dari deployment Google Apps Script agar data tersimpan di Spreadsheet.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwPwCu7ZYZtUJUHCLsphCMFNdUdwfSbU0H5efcEcmWd85CYU259OZoKHvWdYvGSzMjj/exec";
const assets='assets/';
const flora=[
{name:'Kayu Jati',img:'image1.jpeg',ciri:'Tumbuhan kayu bernilai ekonomi tinggi. Kayunya dimanfaatkan sebagai bahan konstruksi dan furnitur.',sebar:'Indonesia bagian Barat, terutama Jawa Tengah.',wilayah:'Asiatis'},
{name:'Meranti',img:'image2.jpeg',ciri:'Tumbuhan kayu berharga yang tumbuh subur di hutan hujan tropis dengan curah hujan dan kelembapan tinggi.',sebar:'Indonesia bagian Barat.',wilayah:'Asiatis'},
{name:'Mahoni',img:'image3.jpeg',ciri:'Tumbuhan kayu keras bernilai ekonomi tinggi. Kayunya sering dimanfaatkan untuk perabot atau furnitur.',sebar:'Indonesia bagian Barat.',wilayah:'Asiatis'},
{name:'Rafflesia Arnoldi',img:'image4.jpeg',ciri:'Tumbuhan endemik langka yang tumbuh alami di daerah asalnya.',sebar:'Pulau Sumatra.',wilayah:'Asiatis'},
{name:'Hutan Mangrove (Bakau)',img:'image5.jpeg',ciri:'Tumbuhan yang membentuk ekosistem hutan di kawasan pesisir atau pantai.',sebar:'Pantai Timur Sumatra, pantai Barat dan Selatan Kalimantan, serta pantai Barat dan Utara Jawa.',wilayah:'Asiatis'},
{name:'Sabana',img:'image6.jpeg',ciri:'Padang rumput luas yang diselingi tumbuhan kayu. Terbentuk di wilayah dengan curah hujan relatif sedikit.',sebar:'Kepulauan Nusa Tenggara dan sekitarnya.',wilayah:'Peralihan'},
{name:'Stepa',img:'image7.jpeg',ciri:'Area tanah kering yang hanya ditumbuhi semak belukar karena intensitas curah hujan relatif sedikit.',sebar:'Kepulauan Nusa Tenggara dan sekitarnya.',wilayah:'Peralihan'},
{name:'Anggrek',img:'image8.jpeg',ciri:'Salah satu flora berbunga yang menjadi ciri khas utama kawasan timur.',sebar:'Indonesia bagian Timur.',wilayah:'Australis'},
{name:'Sagu',img:'image9.jpeg',ciri:'Tumbuhan yang mendominasi kawasan hutan hujan tropis bagian timur, dengan karakteristik flora yang memiliki kesamaan sejarah geologi dengan Australia.',sebar:'Indonesia bagian Timur.',wilayah:'Australis'},
{name:'Kelapa',img:'image10.jpeg',ciri:'Batang tinggi tidak bercabang, buah bersabut dan bertempurung keras. Tumbuh baik di pesisir, dataran rendah, iklim tropis, dan tanah berpasir.',sebar:'Hampir seluruh wilayah pesisir Indonesia.',wilayah:'Asiatis hingga Australis'}];
const fauna=[
{name:'Badak Bercula Satu',img:'image11.jpeg',ciri:'Mamalia berukuran besar dan menjadi fauna endemik wilayah Indonesia bagian barat.',sebar:'Terutama Pulau Jawa dan pulau-pulau kecil di sekitarnya.',wilayah:'Asiatis'},
{name:'Orang Utan',img:'image12.jpeg',ciri:'Mamalia berukuran besar yang menjadi salah satu fauna khas wilayah barat.',sebar:'Pulau Sumatra dan Kalimantan beserta pulau-pulau kecil di sekitarnya.',wilayah:'Asiatis'},
{name:'Burung Merak',img:'image13.jpeg',ciri:'Burung khas wilayah barat; materi sumber menyebut ekosistem Asiatis secara umum memiliki sedikit jenis burung berwarna.',sebar:'Indonesia bagian Barat.',wilayah:'Asiatis'},
{name:'Jalak Bali',img:'image14.jpeg',ciri:'Spesies burung endemik yang terdapat di wilayah barat.',sebar:'Indonesia bagian Barat.',wilayah:'Asiatis'},
{name:'Harimau Sumatra',img:'image15.jpeg',ciri:'Hewan karnivora penghuni hutan hujan tropis, berbulu oranye dengan corak belang hitam. Kelangsungan hidupnya bergantung pada hutan dan ketersediaan mangsa.',sebar:'Sumatra, antara lain Aceh, Sumatra Utara, Riau, Jambi, Sumatra Barat, Bengkulu, Sumatra Selatan, dan Lampung.',wilayah:'Asiatis'},
{name:'Komodo',img:'image16.jpeg',ciri:'Hewan khas fauna peralihan yang memiliki ciri berbeda dari fauna wilayah barat dan timur.',sebar:'Materi sumber mencantumkan Sulawesi, Maluku, Nusa Tenggara, dan pulau di sekitarnya.',wilayah:'Peralihan'},
{name:'Anoa',img:'image17.jpeg',ciri:'Hewan khas fauna peralihan dengan karakteristik berbeda dari fauna Asiatis maupun Australis.',sebar:'Materi sumber mencantumkan Sulawesi, Maluku, Nusa Tenggara, dan pulau di sekitarnya.',wilayah:'Peralihan'},
{name:'Babirusa',img:'image18.jpeg',ciri:'Hewan khas fauna peralihan dengan ciri tersendiri yang membedakannya dari fauna barat dan timur.',sebar:'Materi sumber mencantumkan Sulawesi, Maluku, Nusa Tenggara, dan pulau di sekitarnya.',wilayah:'Peralihan'},
{name:'Burung Maleo',img:'image19.jpeg',ciri:'Unggas khas fauna peralihan dengan karakteristik tersendiri.',sebar:'Materi sumber mencantumkan Sulawesi, Maluku, Nusa Tenggara, dan pulau di sekitarnya.',wilayah:'Peralihan'},
{name:'Burung Kasuari',img:'image20.jpeg',ciri:'Burung endemik wilayah timur dan termasuk fauna tipe Australis.',sebar:'Pulau Papua, Kepulauan Aru, dan beberapa pulau kecil di sekitarnya.',wilayah:'Australis'},
{name:'Burung Cendrawasih',img:'image21.jpeg',ciri:'Burung berbulu indah yang menjadi fauna khas dan endemik wilayah timur.',sebar:'Pulau Papua, Kepulauan Aru, dan beberapa pulau kecil di sekitarnya.',wilayah:'Australis'},
{name:'Kangguru',img:'image22.jpeg',ciri:'Mamalia berukuran relatif kecil yang termasuk kelompok hewan berkantung.',sebar:'Papua, Kepulauan Aru, dan sekitarnya.',wilayah:'Australis'}];
const questions=[
{q:'Faktor persebaran flora dan fauna yang berkaitan dengan suhu, curah hujan, kelembapan, dan sinar matahari adalah …',o:['Kondisi tanah','Iklim','Relief daratan','Formasi geologi'],a:1},
{q:'Kesuburan, tekstur, dan kandungan mineral tanah termasuk faktor …',o:['Iklim','Kondisi tanah','Relief daratan','Garis Wallace'],a:1},
{q:'Tinggi rendahnya permukaan bumi yang memengaruhi suhu disebut …',o:['Relief daratan','Formasi geologi','Curah hujan','Kelembapan'],a:0},
{q:'Garis khayal yang membatasi wilayah Barat dan Tengah adalah …',o:['Garis Weber','Garis Wallace','Garis Khatulistiwa','Garis Bujur'],a:1},
{q:'Flora yang persebarannya secara khusus banyak ditemukan di Jawa Tengah adalah …',o:['Sagu','Anggrek','Kayu jati','Rafflesia'],a:2},
{q:'Sabana dan stepa banyak ditemukan di …',o:['Nusa Tenggara','Papua bagian timur saja','Sumatra bagian utara','Jawa bagian barat saja'],a:0},
{q:'Flora yang menjadi ciri khas kawasan Indonesia bagian timur antara lain …',o:['Jati dan mahoni','Mangrove dan rafflesia','Anggrek dan sagu','Meranti dan jati'],a:2},
{q:'Hewan berkantung dalam materi ini adalah …',o:['Badak bercula satu','Kangguru','Harimau Sumatra','Komodo'],a:1},
{q:'Fauna yang menjadi ciri khas wilayah peralihan antara lain …',o:['Anoa dan babirusa','Orang utan dan badak Jawa','Kasuari dan cendrawasih','Harimau dan merak'],a:0},
{q:'Mengapa mangrove banyak tumbuh di kawasan pesisir?',o:['Karena selalu berada di pegunungan','Karena merupakan ekosistem hutan kawasan pesisir','Karena hanya hidup di tanah vulkanik','Karena tidak membutuhkan air'],a:1}
];
async function sendData(payload){if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL.includes('TEMPEL_URL'))return {ok:false,local:true};try{await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});return {ok:true}}catch(e){return {ok:false}}}
function App(){const [student,setStudent]=useState(null),[login,setLogin]=useState({nama:'',kelas:'',absen:''}),[tab,setTab]=useState('materi'),[doneQuiz,setDoneQuiz]=useState(false),[doneLKPD,setDoneLKPD]=useState(false),[quizResult,setQuizResult]=useState(null),[answers,setAnswers]=useState({}),[submitted,setSubmitted]=useState(false),[flipped,setFlipped]=useState({}),[region,setRegion]=useState(null),[lkpd,setLkpd]=useState({namaObjek:'',jenis:'',wilayah:'',ciri:'',faktor:'',konservasi:'',refleksi:''}),[saving,setSaving]=useState(false),[saveMsg,setSaveMsg]=useState('');
const doLogin=async e=>{e.preventDefault();const s={...login,nama:login.nama.trim(),kelas:login.kelas.trim(),absen:login.absen.trim(),loginAt:new Date().toISOString()};if(!s.nama||!s.kelas||!s.absen)return;setStudent(s);await sendData({type:'login',...s});};
const submitQuiz=async()=>{let score=questions.reduce((n,q,i)=>n+(Number(answers[i])===q.a?1:0),0)*10;let result={score,correct:score/10,total:questions.length,answers,submittedAt:new Date().toISOString()};setQuizResult(result);setSubmitted(true);setDoneQuiz(true);setTab('kuis');await sendData({type:'quiz',...student,...result});};
const submitLKPD=async e=>{e.preventDefault();setSaving(true);let payload={type:'lkpd',...student,...lkpd,submittedAt:new Date().toISOString()};let r=await sendData(payload);setSaveMsg(r.local?'LKPD selesai diisi, tetapi URL Apps Script belum terhubung.':r.ok?'LKPD berhasil dikirim. Periksa Spreadsheet.':'LKPD selesai diisi, tetapi pengiriman belum dapat dipastikan. Periksa koneksi dan Spreadsheet.');setDoneLKPD(true);setSaving(false);};
if(!student)return <div className="min-h-screen flex items-center justify-center p-5 bg-gradient-to-br from-emerald-100 via-cyan-50 to-blue-100"><form onSubmit={doLogin} className="fade bg-white w-full max-w-md rounded-3xl shadow-2xl p-8 border-t-8 border-emerald-500"><div className="text-center"><div className="text-5xl mb-3">🌿🦜</div><h1 className="text-3xl font-black text-emerald-800">Petualangan Flora & Fauna Indonesia</h1><p className="text-gray-600 mt-3">by : <b>Moh. Shafly Faishal Abdi, S.Pd</b></p><p className="text-sm text-gray-500 mt-2 mb-6">Masuk untuk memulai pembelajaran</p></div><label className="block font-bold mb-1">Nama lengkap</label><input className="field mb-4" required value={login.nama} onChange={e=>setLogin({...login,nama:e.target.value})} placeholder="Masukkan nama lengkap"/><label className="block font-bold mb-1">Kelas</label><input className="field mb-4" required value={login.kelas} onChange={e=>setLogin({...login,kelas:e.target.value})} placeholder="Contoh: VIII A"/><label className="block font-bold mb-1">Nomor absen</label><input className="field mb-6" required type="number" min="1" value={login.absen} onChange={e=>setLogin({...login,absen:e.target.value})} placeholder="Masukkan nomor absen"/><button className="w-full rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 text-lg">Login <i className="fa-solid fa-right-to-bracket ml-2"></i></button><p className="text-xs text-gray-400 text-center mt-4">Data pembelajaran digunakan untuk pencatatan aktivitas siswa.</p></form></div>;
return <div className="min-h-screen"><header className="bg-gradient-to-r from-emerald-700 to-teal-700 text-white px-4 py-5 text-center"><h1 className="text-2xl md:text-3xl font-black">🌿 Petualangan Flora & Fauna Indonesia</h1><p className="mt-1">by : <b>Moh. Shafly Faishal Abdi, S.Pd</b></p><p className="text-sm mt-2">Halo, {student.nama} · {student.kelas} · Absen {student.absen}</p></header><nav className="bg-white shadow sticky top-0 z-30 flex justify-center flex-wrap"><button className={'navbtn '+(tab==='materi'?'active':'')} onClick={()=>setTab('materi')} disabled={!doneLKPD&&tab!=='materi'} title={!doneLKPD&&tab!=='materi'?'Materi terkunci sampai LKPD selesai':'Buka materi'}>📚 Materi {!doneLKPD&&tab!=='materi'?'🔒':''}</button><button className={'navbtn '+(tab==='kuis'?'active':'')} onClick={()=>setTab('kuis')} disabled={!doneLKPD&&tab!=='kuis'} title={!doneLKPD&&tab!=='kuis'?'Kuis terkunci sampai tahap sebelumnya selesai':'Buka kuis'}>🎯 Kuis {!doneLKPD&&tab!=='kuis'?'🔒':''}</button><button className={'navbtn '+(tab==='lkpd'?'active':'')} onClick={()=>setTab('lkpd')} disabled={!doneLKPD&&!doneQuiz} title={!doneLKPD&&!doneQuiz?'LKPD terbuka setelah kuis selesai':'Buka LKPD'}>📝 LKPD {!doneLKPD&&tab!=='lkpd'?'🔒':''}</button></nav><main className="max-w-6xl mx-auto p-4 md:p-7 space-y-6 fade">
{tab==='materi'&&<><section className="bg-white rounded-2xl p-6 shadow"><h2 className="text-2xl font-black text-emerald-800 mb-3">Faktor yang Memengaruhi Persebaran Flora dan Fauna</h2><div className="grid md:grid-cols-2 gap-4">{[['Iklim','Suhu, curah hujan, kelembapan, dan sinar matahari menentukan jenis tumbuhan yang dapat hidup.'],['Kondisi Tanah','Kesuburan, tekstur, dan kandungan mineral atau air dalam tanah menjadi sumber nutrisi bagi akar.'],['Relief Daratan','Tinggi rendahnya permukaan bumi seperti dataran rendah, lembah, atau pegunungan memengaruhi suhu udara.'],['Formasi Geologi','Sejarah pembentukan bumi dan pergerakan benua dapat memisahkan atau menyatukan daratan.']].map((x,i)=><div key={x[0]} className="rounded-xl p-4 bg-emerald-50"><h3 className="font-extrabold text-emerald-800">{i+1}. {x[0]}</h3><p className="mt-1 text-sm">{x[1]}</p></div>)}</div><p className="mt-4 text-sm">Persebaran dibatasi garis khayal, yaitu Garis Wallace yang membatasi wilayah Barat dan Tengah serta Garis Webber yang membatasi wilayah Tengah dan Timur.</p></section><section className="bg-white rounded-2xl p-5 shadow"><h2 className="text-2xl font-black text-blue-800 mb-2">🗺️ Peta Persebaran Indonesia</h2><p className="text-sm text-gray-600 mb-4">Klik salah satu wilayah pada peta untuk membaca ringkasannya.</p><div className="relative max-w-4xl mx-auto rounded-xl overflow-hidden border bg-sky-50"><img src={assets+'peta-indonesia.jpeg'} alt="Peta kepulauan Indonesia" className="w-full block"/><button className="map-area" style={{left:'1%',top:'4%',width:'40%',height:'82%'}} onClick={()=>setRegion('Asiatis')}><span className="map-label">Asiatis (Barat)</span></button><button className="map-area" style={{left:'42%',top:'12%',width:'24%',height:'78%'}} onClick={()=>setRegion('Peralihan')}><span className="map-label">Peralihan (Tengah)</span></button><button className="map-area" style={{left:'67%',top:'15%',width:'32%',height:'75%'}} onClick={()=>setRegion('Australis')}><span className="map-label">Australis (Timur)</span></button></div>{region&&<div className="mt-4 p-4 rounded-xl bg-blue-50"><div className="flex justify-between"><b>Wilayah {region}</b><button onClick={()=>setRegion(null)} aria-label="Tutup">✕</button></div><p className="text-sm mt-1">{region==='Asiatis'?'Meliputi Indonesia bagian barat seperti Sumatra, Jawa, dan Kalimantan. Contoh flora: jati, meranti, mahoni, rafflesia, dan mangrove. Contoh fauna: badak Jawa, orang utan, harimau Sumatra, merak, dan Jalak Bali.':region==='Peralihan'?'Meliputi wilayah tengah seperti Sulawesi dan Nusa Tenggara. Contoh flora: sabana dan stepa. Contoh fauna: komodo, anoa, babirusa, dan burung maleo.':'Meliputi Indonesia bagian timur seperti Papua dan sekitarnya. Contoh flora: anggrek dan sagu. Contoh fauna: kasuari, cendrawasih, dan kangguru.'}</p></div>}</section><section className="bg-white rounded-2xl p-5 shadow"><h2 className="text-2xl font-black text-emerald-800">🌱 Kartu Flora Indonesia</h2><p className="text-sm text-gray-600 mb-4">Klik kartu untuk membalik dan membaca keterangan.</p><div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">{flora.map((x,i)=><Flip key={x.name} x={x} flipped={!!flipped['f'+i]} toggle={()=>setFlipped({...flipped,['f'+i]:!flipped['f'+i]})}/>)}</div></section><section className="bg-white rounded-2xl p-5 shadow"><h2 className="text-2xl font-black text-orange-800">🦜 Kartu Fauna Indonesia</h2><p className="text-sm text-gray-600 mb-4">Klik kartu untuk membalik dan membaca keterangan.</p><div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">{fauna.map((x,i)=><Flip key={x.name} x={x} flipped={!!flipped['a'+i]} toggle={()=>setFlipped({...flipped,['a'+i]:!flipped['a'+i]})}/>)}</div></section><div className="text-center"><button onClick={()=>setTab('kuis')} className="rounded-full px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-black shadow">Mulai Kuis <i className="fa-solid fa-arrow-right ml-2"/></button></div></>}
{tab==='kuis'&&<section className="bg-white rounded-2xl p-6 shadow"><h2 className="text-2xl font-black text-purple-800">🎯 Kuis Pemahaman</h2>{!doneQuiz?<><p className="text-gray-600 my-2">Jawab semua soal. Kuis hanya dapat dikirim satu kali. Nilai tidak menjadi syarat untuk membuka LKPD.</p><div className="space-y-5 mt-5">{questions.map((q,i)=><div key={i} className="p-4 rounded-xl bg-purple-50"><p className="font-bold mb-3">{i+1}. {q.q}</p>{q.o.map((o,j)=><label key={j} className="flex gap-3 items-start p-2 rounded-lg hover:bg-white cursor-pointer"><input type="radio" name={'q'+i} checked={String(answers[i])===String(j)} onChange={()=>setAnswers({...answers,[i]:j})} className="mt-1"/><span>{String.fromCharCode(65+j)}. {o}</span></label>)}</div>)}</div><button disabled={Object.keys(answers).length!==questions.length} onClick={submitQuiz} className="mt-6 rounded-xl px-7 py-3 bg-purple-600 text-white font-black disabled:opacity-40">Kirim Jawaban</button></>:<div className="mt-5 p-6 rounded-xl bg-emerald-50 text-center"><div className="text-5xl">🎉</div><h3 className="text-2xl font-black mt-2">Kuis sudah dikerjakan!</h3><p className="text-xl mt-2">Skor: <b>{quizResult?.score??0}/100</b></p><p className="mt-2">Kamu dapat melanjutkan ke LKPD tanpa syarat nilai minimum.</p><button onClick={()=>setTab('lkpd')} className="mt-5 rounded-xl px-7 py-3 bg-emerald-600 text-white font-black">Lanjut ke LKPD →</button></div>}</section>}
{tab==='lkpd'&&<section className="bg-white rounded-2xl p-6 shadow"><h2 className="text-2xl font-black text-teal-800">📝 LKPD — Kartu Identitas Flora/Fauna</h2><p className="mt-2 text-gray-600">Pilih satu flora atau fauna Indonesia yang kamu sukai, lalu isi informasi berikut.</p><form onSubmit={submitLKPD} className="mt-5 space-y-4"><div><label className="block font-bold mb-1">Nama flora/fauna</label><input className="field" required value={lkpd.namaObjek} onChange={e=>setLkpd({...lkpd,namaObjek:e.target.value})} placeholder="Nama lokal dan nama ilmiah jika tahu"/></div><div><label className="block font-bold mb-1">Jenis</label><select className="field" required value={lkpd.jenis} onChange={e=>setLkpd({...lkpd,jenis:e.target.value})}><option value="">Pilih jenis</option><option>Flora</option><option>Fauna</option></select></div><div><label className="block font-bold mb-1">Asal wilayah</label><select className="field" required value={lkpd.wilayah} onChange={e=>setLkpd({...lkpd,wilayah:e.target.value})}><option value="">Pilih wilayah persebaran</option><option>Asiatis</option><option>Peralihan</option><option>Australis</option><option>Pesisir Asiatis hingga Australis</option></select></div><div><label className="block font-bold mb-1">Ciri-ciri fisik</label><textarea className="field" rows="3" required value={lkpd.ciri} onChange={e=>setLkpd({...lkpd,ciri:e.target.value})} placeholder="Jelaskan keunikannya secara singkat"/></div><div><label className="block font-bold mb-1">Faktor alam</label><textarea className="field" rows="3" required value={lkpd.faktor} onChange={e=>setLkpd({...lkpd,faktor:e.target.value})} placeholder="Hubungkan dengan iklim, tanah, atau relief"/></div><div><label className="block font-bold mb-1">Status konservasi dan pesan pelestarian</label><textarea className="field" rows="3" required value={lkpd.konservasi} onChange={e=>setLkpd({...lkpd,konservasi:e.target.value})} placeholder="Apakah langka/dilindungi? Bagaimana cara menjaganya?"/></div><div><label className="block font-bold mb-1">Refleksi pembelajaran</label><textarea className="field" rows="3" required value={lkpd.refleksi} onChange={e=>setLkpd({...lkpd,refleksi:e.target.value})} placeholder="Apa hal baru yang kamu pelajari?"/></div><button disabled={saving} className="rounded-xl px-7 py-3 bg-teal-600 hover:bg-teal-700 text-white font-black disabled:opacity-50">{saving?'Mengirim...':'Kirim LKPD ke Guru'}</button>{saveMsg&&<p className="mt-3 p-3 rounded-xl bg-emerald-50 text-emerald-800">{saveMsg}</p>}{doneLKPD&&<div className="mt-4 p-4 rounded-xl bg-green-100 text-green-900"><b>✅ LKPD selesai dikerjakan.</b><p className="text-sm mt-1">Semua menu Materi, Kuis, dan LKPD sekarang dapat dibuka kembali.</p></div>}</form></section>}
</main><footer className="text-center p-5 bg-slate-800 text-slate-200 text-sm">Media Pembelajaran Interaktif IPS SMP · Petualangan Flora & Fauna Indonesia</footer></div>}
function Flip({x,flipped,toggle}){return <button type="button" className={'flip-card text-left '+(flipped?'flipped':'')} onClick={toggle} aria-label={'Balik kartu '+x.name}><div className="flip-inner"><div className="flip-front"><img src={assets+x.img} alt={x.name} onError={e=>{e.currentTarget.src='LINK_GDRIVE_FOTO_'+x.name.toUpperCase().replace(/[^A-Z0-9]+/g,'_')+'_DI_SINI'}}/><div className="name">{x.name} <span className="ml-2 text-xs text-emerald-600">↻ klik</span></div></div><div className="flip-back"><h3 className="text-lg font-black text-emerald-800">{x.name}</h3><p className="text-sm mt-3"><b>Ciri-ciri:</b> {x.ciri}</p><p className="text-sm mt-3"><b>Persebaran:</b> {x.sebar}</p><span className="region-tag mt-3">Wilayah {x.wilayah}</span><p className="text-xs text-gray-500 mt-4">Klik lagi untuk kembali ke gambar</p></div></div></button>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
 </body>
</html>
